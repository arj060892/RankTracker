<div class="row mt-4">
  <div class="col-12">
    <div class="card">
      <div
        class="card-header bg-primary text-white d-flex align-items-center py-2"
      >
        <h5 class="mb-0 me-auto">Ranking Dashboard</h5>
        <div class="d-flex flex-nowrap align-items-center gap-2">
          <select
            class="form-select form-select-sm"
            style="width: 120px"
            [(ngModel)]="selectedEngine"
            (change)="onSearch()"
            name="engine"
          >
            <option *ngFor="let e of engines" [value]="e">{{ e }}</option>
          </select>

          <input
            type="text"
            class="form-control form-control-sm"
            style="width: 200px"
            placeholder="URL"
            [(ngModel)]="urlValue"
            name="url"
          />

          <input
            type="text"
            class="form-control form-control-sm"
            style="width: 200px"
            placeholder="Phrase"
            [(ngModel)]="phraseValue"
            name="phrase"
          />

          <button
            class="btn btn-light btn-sm"
            (click)="onSearch()"
            [disabled]="loading"
          >
            <span
              *ngIf="loading"
              class="spinner-border spinner-border-sm me-1"
            ></span>
            Search
          </button>
        </div>
      </div>

      <div class="card-body">
        <div *ngIf="getAverageStatus() as status" class="mb-4">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h6>Average Position</h6>
              <h2>{{ status.position || "Not ranked" }}</h2>
            </div>
            <div class="text-end">
              <h6>Last Updated</h6>
              <p>{{ status.date | date : "short" }}</p>
            </div>
          </div>
        </div>

        <div *ngIf="!loading" style="height: 250px">
          <apx-chart
            [series]="chartOptions.series"
            [chart]="chartOptions.chart"
            [xaxis]="chartOptions.xaxis"
            [yaxis]="chartOptions.yaxis"
            [stroke]="chartOptions.stroke"
            [markers]="chartOptions.markers"
            [tooltip]="chartOptions.tooltip"
            [colors]="chartOptions.colors"
          ></apx-chart>
        </div>
      </div>
    </div>
  </div>
</div>
